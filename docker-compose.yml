services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
    image: faberiq/comfyui-blackwell:latest
    container_name: comfyui
    restart: unless-stopped
    ports:
      - "8188:8188"
    shm_size: "32gb"
    ulimits:
      memlock: -1
      stack: 67108864
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/data/hf-cache
      - HF_TOKEN=${HF_TOKEN:-}
      - COMFY_ARGS=--listen 0.0.0.0 --port 8188 --use-sage-attention --preview-method auto
    volumes:
      - ./data/models:/data/ComfyUI/models
      - ./data/input:/data/ComfyUI/input
      - ./data/output:/data/ComfyUI/output
      - ./data/custom_nodes:/data/ComfyUI/custom_nodes
      - ./data/user:/data/ComfyUI/user
      - ./data/hf-cache:/data/hf-cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Optional: standalone TTS service (Chatterbox) with a Gradio UI on :7860
  tts:
    image: faberiq/comfyui-blackwell:latest
    container_name: chatterbox-tts
    restart: unless-stopped
    depends_on: [comfyui]
    ports:
      - "7860:7860"
    shm_size: "8gb"
    environment:
      - HF_HOME=/data/hf-cache
    volumes:
      - ./data/hf-cache:/data/hf-cache
      - ./data/input:/data/audio-out
    command: >
      bash -lc "pip install -q chatterbox-tts gradio &&
                python /opt/tts_ui.py"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
